#stars::after{content:"";position:absolute;inset:0;background:linear-gradient(#050a2477,#050a24aa)}
@keyframes zm{to{transform:scale(1.06)}}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.pg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:2vmin;padding:max(70px,env(safe-area-inset-top)) 3vmin max(2vmin,env(safe-area-inset-bottom));animation:in .6s ease both;overflow:auto;text-align:center}
@keyframes in{from{opacity:0;transform:translateX(5vw) scale(.97)}to{opacity:1;transform:none}}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:none;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#050a24ee,transparent)}
#hud button{width:58px;height:58px;min-width:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#4a7bff,#0b1a52);box-shadow:0 0 16px var(--neon),inset 0 -4px 8px #0006}
#hud button svg{width:36px;height:36px}
#hud .bar{flex:1;height:18px;border-radius:9px;background:#13236b;border:2px solid var(--neon);overflow:hidden}
#hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .8s}
#sc{font-size:26px;font-weight:900;color:var(--gold);white-space:nowrap}
button{font:inherit;cursor:pointer;color:#fff;border:3px solid var(--cyan);background:linear-gradient(#1a3ea8,#0b1a52);border-radius:18px;padding:12px 26px;box-shadow:0 0 14px var(--neon)}
button:active{transform:scale(.94)}
.big{font-size:clamp(24px,4.4vmin,40px);font-weight:900;min-height:72px;background:linear-gradient(#ff5468,#c4122a);border-color:#ffd0d6;animation:pulse 2s infinite;letter-spacing:1px}
@keyframes pulse{0%,100%{box-shadow:0 0 12px var(--red)}50%{box-shadow:0 0 34px 6px var(--red)}}
h1{font-size:clamp(28px,6vmin,56px);margin:0;color:var(--gold);text-shadow:0 0 18px var(--neon)}
p.t{font-size:clamp(22px,4vmin,38px);margin:0;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:3vmin;justify-content:center;align-items:stretch}
.card{background:linear-gradient(#10246f,#0a1546);border:4px solid var(--neon);border-radius:26px;padding:2vmin;box-shadow:0 0 18px #19c3ff88;display:flex;flex-direction:column;align-items:center;gap:1vmin;transition:transform .25s}
.card svg,.card img{width:min(38vw,300px);height:auto}
.card.sm svg,.card.sm img{width:min(22vw,170px)}
img.vh{border-radius:16px;display:block;margin:0 auto}
.node .ic img.a5{width:58%}
.a5s{height:min(26vh,230px);width:auto!important;border:3px solid var(--cyan);box-shadow:0 0 18px var(--neon)}
.a5b{height:min(52vh,430px);width:auto;border:4px solid var(--cyan);box-shadow:0 0 28px var(--neon)}
.card.opt:hover{transform:scale(1.05)}
.card.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15) rotate(-3deg)}}
.card.no{animation:shake .5s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.card.yes{border-color:var(--ok);box-shadow:0 0 30px var(--ok)}
.card.sel{border-color:var(--gold);box-shadow:0 0 30px var(--gold)}
.nm{font-size:clamp(20px,3.6vmin,34px);font-weight:900}
.mv{animation:drive 5s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.arm{transform-box:fill-box;transform-origin:0% 100%;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{50%{transform:rotate(-22deg)}}
.agent{width:min(26vmin,190px);height:auto}
.cel{animation:jump 1s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-20px) rotate(4deg)}}
.map{display:flex;flex-wrap:wrap;gap:3vmin;justify-content:center;max-width:960px}
.node{width:min(40vw,230px);cursor:pointer;position:relative;text-align:center}
.node .ic{font-size:0}
.node .ic svg,.node .ic img{width:100%;height:auto}
.node small{font-size:clamp(16px,2.8vmin,24px);display:block}
.node .st{position:absolute;top:-10px;right:-10px;width:48px;height:48px;border-radius:50%;background:#13236b;border:3px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.node.done .st{background:var(--ok);border-color:#fff;color:#042}
.boxes{display:flex;gap:1.2vmin;justify-content:center;flex-wrap:wrap}
.lt{width:clamp(40px,9vmin,80px);height:clamp(54px,11vmin,96px);border-radius:12px;background:#0a1546;border:3px solid var(--cyan);font-size:clamp(28px,6vmin,56px);font-weight:900;display:flex;align-items:center;justify-content:center}
.lt.gap{border:0;background:none;width:3vmin}
.lt.blank{border-color:var(--gold);color:var(--gold);animation:pulse 1.6s infinite}
.lt.fill{color:var(--ok);border-color:var(--ok)}
.opts button{font-size:clamp(34px,8vmin,64px);font-weight:900;width:clamp(80px,16vmin,130px);height:clamp(80px,16vmin,130px);padding:0}
.puz{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(88vw,62vh,520px)}
.puz svg{width:100%;height:auto;border:4px solid var(--cyan);border-radius:12px;background:#9fe3ff;display:block}
.puz svg.sel{border-color:var(--gold);box-shadow:0 0 22px var(--gold);transform:scale(.96)}
.puz.won .pc{border-color:var(--ok)}
.pc{background-size:200% 200%;border:4px solid var(--cyan);border-radius:12px;position:relative;cursor:pointer;transition:transform .2s}
.pc.sel{border-color:var(--gold);box-shadow:0 0 22px var(--gold);transform:scale(.95)}
.pc.ok{border-color:var(--ok);cursor:default}
.pc.ok::after{content:'✔';position:absolute;right:6px;top:2px;color:var(--ok);font-size:30px;font-weight:900;text-shadow:0 0 6px #000}
.pc.target{border-color:var(--gold);animation:pulse 1s infinite}
.pc.from{border-color:var(--ok);animation:pulse 1s infinite;box-shadow:0 0 26px var(--ok)}
.nb{position:absolute;left:6px;top:4px;width:38px;height:38px;border-radius:50%;background:#000b;border:2px solid #fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center}
.nonum .nb{display:none}
.ref{position:relative;width:min(34vw,220px)}
.ref img{width:100%;display:block;border-radius:10px;border:3px solid #fff}
.ref:before{content:'';position:absolute;inset:3px;background:linear-gradient(#fffc,#fffc) center/3px 100% no-repeat,linear-gradient(#fffc,#fffc) center/100% 3px no-repeat}
.ref i{position:absolute;width:34px;height:34px;border-radius:50%;background:#000b;border:2px solid #fff;font-weight:900;font-size:22px;line-height:30px;font-style:normal;text-align:center}
.msg{font-size:clamp(30px,7vmin,64px);font-weight:900;min-height:1.2em;color:var(--gold);text-shadow:0 0 14px var(--gold)}
.msg.bad{color:#ffb0ba;text-shadow:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx b{position:absolute;font-size:44px;color:var(--gold);animation:fly 1.5s ease-out forwards;text-shadow:0 0 12px #fff}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(280deg);opacity:0}}
.badge{width:min(40vmin,260px);height:auto;filter:drop-shadow(0 0 22px var(--gold));animation:jump 1.6s infinite}
.cert{border:6px double var(--gold);border-radius:26px;padding:2.5vmin;background:#0b1a5299;max-width:900px}
.cert .row svg,.cert .row img{width:min(26vw,150px);height:auto}
/* Halaman 1: imej penuh skrin, nisbah 16:9 dikekalkan */
#home{padding:0;background:#000;overflow:hidden}
#stg{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
#stg img{width:100%;height:100%;display:block}
#mula{position:absolute;left:36%;top:77.5%;width:30%;height:14.5%;background:transparent;border:0;border-radius:22px;padding:0;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #ff3b4e88}50%{box-shadow:0 0 28px 8px #ff3b4eaa}}
.sp{position:absolute;color:#fff;font-size:2.2vw;animation:tw 1.6s ease-in-out infinite alternate;pointer-events:none}
/* Fon: Lilita One (tajuk, gaya permainan), Fredoka (arahan), Andika (huruf & nama; direka untuk pembaca awal) */
h1,.big,.msg,#sc{font-family:"Lilita One","Fredoka","Arial Rounded MT Bold",sans-serif;font-weight:400;letter-spacing:1.5px}
h1,.msg{-webkit-text-stroke:2px #0b1a52;paint-order:stroke fill}
.big{text-shadow:0 3px 0 #7a0a1c}
p.t{font-weight:600}
.lt,.nm,.opts button{font-family:"Andika","Fredoka",sans-serif;font-weight:700}
</style>
</head>

 {n:'Kenali Basikal dan Motosikal',ic:'basikal',vs:['basikal','motosikal'],st:[

let ac;
function tone(seq){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}}
const snd={click:()=>tone([[660,.07]]),good:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]),bad:()=>tone([[392,.18],[330,.3]]),win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.15],[784,.12],[1047,.4]])};

/* Suara: Web Speech API (suara peranti, bahasa Melayu jika ada). Tidak bermain automatik; hanya selepas murid menekan. */
function say(t,delay=0,cut=false){if(!S.snd||!('speechSynthesis' in window))return;setTimeout(()=>{try{const y=speechSynthesis,vs=y.getVoices(),v=vs.find(x=>/^ms/i.test(x.lang))||vs.find(x=>/^id/i.test(x.lang));if(cut)y.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'ms-MY';if(v)u.voice=v;u.rate=.8;u.pitch=1.1;u.onstart=()=>duck(1);u.onend=u.onerror=()=>duck(0);y.speak(u)}catch(e){}},delay)}
document.addEventListener('click',e=>{if(!window._u){window._u=1;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(x){}}if(e.target.closest('button'))snd.click()},true);
/* ===== MUZIK LATAR: instrumen sintetik (marimba, loceng, kecapi, pad, bes, sintesis) ===== */
let mG,mTm=0,mScene='',mStep=0,mNext=0,mDuck=1;
const getAc=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac};
const midi=m=>440*Math.pow(2,(m-69)/12);
const PEN=[60,62,64,67,69,72,74,76,79,81];           /* skala pentatonik C: sentiasa merdu */
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]]; /* C – Am – F – G */
function nt(m,t,d,ty,v,at=.01){const c=getAc(),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=midi(m);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mG);o.start(t);o.stop(t+d+.05)}
const INS={
 marimba:(m,t,v)=>{nt(m,t,.45,'sine',v);nt(m+24,t,.1,'sine',v*.35)},
 bell:(m,t,v)=>{nt(m,t,1.3,'sine',v);nt(m+19,t,.5,'sine',v*.4);nt(m+28,t,.25,'sine',v*.2)},
 harp:(m,t,v)=>nt(m,t,.9,'triangle',v,.005),
 pad:(m,t,v,d)=>{nt(m,t,d,'sine',v,.4);nt(m+.1,t,d,'triangle',v*.5,.4)},
 bass:(m,t,v)=>nt(m-12,t,.4,'sine',v*1.6),
 syn:(m,t,v)=>nt(m,t,.2,'square',v*.35,.005)};
/* Setiap aktiviti mempunyai muzik sendiri: peta=marimba, maklumat=loceng, kuiz=marimba ceria, huruf=loceng+kecapi, puzzle=kecapi tenang, cabaran=sintesis bertenaga, tamat=loceng meriah */
const SC={
 map:{bpm:96,ins:'marimba',mel:'4-5-42-02-4-3-1-0-2-4-57-5-4-2-',pad:1,bass:1},
 info:{bpm:80,ins:'bell',mel:'4---5---7---5---4---2---0---2---',pad:1},
 q:{bpm:112,ins:'marimba',mel:'45-74-52-45-79-74-52-0-24-57-52-',bass:1},
 l:{bpm:100,ins:'bell',mel:'4---7---9---7---5---4---2---4---',arp:'harp',pad:1},
 p:{bpm:84,arp:'harp',pad:1},
 c:{bpm:124,ins:'marimba',mel:'7-9-7-5-7-9-7-5-4-5-7-5-4-2-4-5-',arp:'syn',bass:1},
 end:{bpm:116,ins:'bell',mel:'7-9-7-9-5-7-9-97-9-7-5-4-5-7-9-',pad:1,bass:1}};
function sched(){const c=getAc(),s=SC[mScene];if(!s)return;const dur=60/s.bpm/2;
 while(mNext<c.currentTime+.4){const i=mStep%32,ch=CH[Math.floor(i/8)],t=mNext;
  if(s.mel){const q=s.mel.padEnd(32,'-')[i];if(q!='-')INS[s.ins](PEN[+q],t,.45)}
  if(s.arp)INS[s.arp](ch[[0,1,2,1][i%4]]+12,t,.3);
  if(s.pad&&i%8==0)ch.forEach(m=>INS.pad(m,t,.1,dur*8));
  if(s.bass&&i%4==0)INS.bass(ch[0],t,.4);
  mStep++;mNext+=dur}}
function music(sc,force){if(sc===undefined)sc=mScene;
 if(!(S.snd&&S.mus&&sc)){clearInterval(mTm);mTm=0;mScene=sc||'';if(mG)mG.gain.setTargetAtTime(0,getAc().currentTime,.05);return}
 const c=getAc();if(!mG){mG=c.createGain();mG.connect(c.destination)}
 mG.gain.setTargetAtTime(.22*mDuck,c.currentTime,.1);
 if(sc!==mScene||!mTm||force){mScene=sc;mStep=0;mNext=c.currentTime+.15}
 if(!mTm)mTm=setInterval(sched,120)}
/* Muzik diperlahankan semasa suara bercakap supaya sebutan jelas */
function duck(on){mDuck=on?.3:1;if(mG&&mTm)mG.gain.setTargetAtTime(.22*mDuck,getAc().currentTime,.1)}

function intro(){music('map');
  show(`${agent()}<h1>MISI MENGENALI PENGANGKUTAN DARAT</h1><p class="t">Mari kita kenali kenderaan pengangkutan darat!</p><div class="row">${LAND.slice(0,3).map(k=>sv(k,'mv')).join('')}</div><button class="big" id="go">TERUSKAN ▶</button>`.replace('class="row"','class="row" style="width:min(90vw,700px)"'));
  $('#go').onclick=map}
function map(){music('map');
  show(`<h1>PETA MISI</h1><div class="map">${M.map((m,i)=>`<div class="card node ${S.done.includes(i)?'done':''}" data-i="${i}"><div class="st">${S.done.includes(i)?'★':i+1}</div><div class="ic">${m.ic=='helikopter'?`<img class="vh bob a5" src="${AGENT5}" alt="Cabaran Ejen">`:sv(m.ic,'bob')}</div><span class="nm">Misi ${i+1}</span><small>${m.n}</small></div>`).join('')}</div>${S.done.length==5?'<button class="big" id="fin">LIHAT SIJIL ★</button>':''}`);
  document.querySelectorAll('.node').forEach(n=>n.onclick=()=>info(+n.dataset.i));
  if($('#fin'))$('#fin').onclick=end}
function info(i){music('info');
  const m=M[i];
  if(!m.vs.length){show(`<h1>Misi 5: Cabaran Ejen</h1><img class="vh bob a5b" src="${AGENT5}" alt="Ejen"><p class="t">Ejen, pilih semua pengangkutan darat!</p><button class="big" id="go">MULA CABARAN ▶</button>`);return $('#go').onclick=()=>run(i,0)}
  show(`<h1>Misi ${i+1}: ${m.n}</h1><div class="row">${m.vs.map(k=>`<div class="card">${sv(k,'mv')}<span class="nm">${V[k]}</span><p class="t" style="font-size:clamp(18px,3vmin,28px)">${FACT[k]}</p><button data-k="${k}">🔊 BACA</button></div>`).join('')}</div><button class="big" id="go">MAIN AKTIVITI ▶</button>`);
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>eja(b));
  $('#go').onclick=()=>run(i,0)}
/* Butang "Baca": huruf menyala satu demi satu dengan bunyi lembut (bukan suara) */
function eja(b){const s=b.parentNode.querySelector('.nm'),w=V[b.dataset.k];say(w,0,true);let n=0;const t=setInterval(()=>{s.innerHTML=w.slice(0,n)+'<span style="color:var(--gold)">'+(w[n]||'')+'</span>'+w.slice(n+1);if(++n>=w.length){clearInterval(t);setTimeout(()=>s.textContent=w,500)}},300)}
/* ===== ENJIN AKTIVITI ===== */
function run(i,j){
  const m=M[i];
  if(j>=m.st.length)return done(i);
  const s=m.st[j],key=i+'-'+j;let first=true;music(s.t);
  const head=`<p class="t" style="font-size:clamp(16px,2.6vmin,24px);color:var(--cyan)">Misi ${i+1} · ${j+1} / ${m.st.length}</p>`;
  const ok=(w)=>{if(first&&!S.got[key]){S.got[key]=1;save()}$('#sc').textContent='★ '+stars();burst();snd.good();say(w||pick(PRAISE),450);setTimeout(()=>run(i,j+1),2600)};
  const bad=()=>{first=false;snd.bad();say($('#mg').textContent,350)};
  if(s.t=='q'){
    show(`${head}<p class="t">${s.q}</p><button data-t="${s.q}" onclick="say(this.dataset.t,0,true)">🔊 BACA SOALAN</button><div class="row">${shuf(s.o).map(k=>`<div class="card opt" data-k="${k}">${sv(k)}<span class="nm">${V[k]}</span></div>`).join('')}</div><div class="msg" id="mg"></div>`);
    document.querySelectorAll('.opt').forEach(c=>c.onclick=()=>{
      if(c.dataset.k==s.a){c.classList.add('yes','pop');const w=pick(PRAISE);$('#mg').textContent=w;ok(w)}
      else{c.classList.remove('no');void c.offsetWidth;c.classList.add('no');$('#mg').className='msg bad';$('#mg').textContent=pick(['Cuba lagi!','Jangan putus asa!']);bad()}})}
  if(s.t=='l'){
    const miss=s.w[s.m],pool=shuf([...new Set('AEIKLORST'.split('').filter(c=>c!=miss))]).slice(0,2);
    show(`${head}<p class="t">Pilih huruf yang hilang.</p>${sv(s.v,'bob')}<button data-t="${s.w}" onclick="say(this.dataset.t,0,true)">🔊 BACA</button><div class="boxes" id="bx">${[...s.w].map((c,x)=>c==' '?'<div class="lt gap"></div>':x==s.m?'<div class="lt blank" id="bl">?</div>':`<div class="lt">${c}</div>`).join('')}</div><div class="row opts">${shuf([miss,...pool]).map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div><div class="msg" id="mg"></div>`);
    document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      if(b.dataset.c==miss){$('#bl').textContent=miss;$('#bl').className='lt fill';$('#mg').textContent=s.w+'!';ok(s.w+'! '+pick(PRAISE))}
      else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#mg').className='msg bad';$('#mg').textContent='Cuba lagi!';bad()}})}
  if(s.t=='p'){
    /* Puzzle 2x2 dengan bantuan: gambar contoh bernombor, kepingan betul dikunci (hijau),
       butang BANTUAN menunjuk kepingan dan kotak yang betul, bantuan automatik jika murid berhenti */
    let ord,sel=-1,hint=-1,idle;const ar=AR[s.v];
    do{ord=[0,1,2,3];for(let r=0;r<2;r++){const a=Math.floor(Math.random()*4),b=(a+1+Math.floor(Math.random()*3))%4;[ord[a],ord[b]]=[ord[b],ord[a]]}}while(ord.every((v,x)=>v==x));
    const solved=()=>ord.every((v,x)=>v==x);
    const giveHint=()=>{if(!$('#pz')||solved())return;hint=ord.findIndex((v,x)=>v!=x);sel=-1;draw();$('#mg').className='msg';$('#mg').style.fontSize='clamp(20px,4vmin,34px)';$('#mg').textContent='Letak kepingan HIJAU di kotak EMAS.'};
    const timer=()=>{clearTimeout(idle);idle=setTimeout(giveHint,25000)};
    const draw=()=>{$('#pz').innerHTML=ord.map((p,x)=>{const cl=(ord[x]==x?'ok ':'')+(sel==x?'sel ':'')+(hint>=0&&ord[hint]!=hint&&x==hint?'target ':'')+(hint>=0&&ord[hint]!=hint&&p==hint?'from ':'');
      return `<div class="pc ${cl}" data-x="${x}" style="aspect-ratio:${ar};background-image:url(${IMG[s.v]});background-position:${(p%2)*100}% ${Math.floor(p/2)*100}%"><span class="nb">${p+1}</span></div>`}).join('');
      document.querySelectorAll('.pc').forEach(e=>e.onclick=()=>{const x=+e.dataset.x;if(ord[x]==x)return;timer();
        if(sel<0){sel=x;hint=-1}else if(sel==x)sel=-1;else{const before=ord.filter((v,q)=>v==q).length;[ord[sel],ord[x]]=[ord[x],ord[sel]];sel=-1;hint=-1;
          const after=ord.filter((v,q)=>v==q).length;$('#mg').style.fontSize='';$('#mg').className=after>before?'msg':'msg bad';
          if(after>before){tone([[784,.12],[988,.2]]);$('#mg').textContent='Betul!'}else if(!solved()){$('#mg').textContent='Cuba lagi!';bad()}}
        draw();if(solved()){clearTimeout(idle);$('#pz').classList.add('won');$('#mg').className='msg';$('#mg').textContent='Tahniah! Puzzle siap!';ok('Tahniah! Puzzle siap!')}})};
    show(`${head}<p class="t">Susun gambar ${V[s.v].toLowerCase()}. Padankan nombor.</p><div class="row" style="align-items:center"><div class="ref"><img src="${IMG[s.v]}" alt="Gambar contoh"><i style="left:6%;top:6%">1</i><i style="right:6%;top:6%">2</i><i style="left:6%;bottom:6%">3</i><i style="right:6%;bottom:6%">4</i></div><div class="puz" id="pz"></div></div><div class="msg" id="mg"></div><div class="row"><button id="hb">💡 BANTUAN</button><button id="nb">🔢 NOMBOR</button></div>`);
    $('#hb').onclick=()=>{giveHint();timer()};$('#nb').onclick=()=>$('#pz').classList.toggle('nonum');
    draw();timer()}
  if(s.t=='c'){
    const all=Object.keys(V),sel=new Set();
    show(`<div class="row" style="align-items:center;flex-wrap:nowrap"><img class="vh a5s" src="${AGENT5}" alt="Ejen"><p class="t">Pilih semua pengangkutan darat.</p></div><div class="row" style="max-width:1000px">${all.map(k=>`<div class="card opt sm" data-k="${k}" style="padding:1vmin">${sv(k)}<span class="nm" style="font-size:clamp(14px,2.4vmin,22px)">${V[k]}</span></div>`).join('')}</div><div class="msg" id="mg"></div><button class="big" id="ck">SEMAK ✔</button>`);
    document.querySelectorAll('.opt').forEach(c=>c.onclick=()=>{c.classList.toggle('sel');sel.has(c.dataset.k)?sel.delete(c.dataset.k):sel.add(c.dataset.k)});
    $('#ck').onclick=()=>{let right=true;document.querySelectorAll('.opt').forEach(c=>{const k=c.dataset.k,L=LAND.includes(k),S2=sel.has(k);c.classList.remove('yes','no');if(L&&S2)c.classList.add('yes');else if(L!=S2){right=false;if(!L&&S2){void c.offsetWidth;c.classList.add('no')}}});
      if(right){$('#mg').className='msg';$('#mg').textContent='Hebat, Ejen!';ok('Hebat, Ejen!')}else{$('#mg').className='msg bad';$('#mg').textContent='Hampir! Cuba lagi!';bad()}}}
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function done(i){music('end');
  if(!S.done.includes(i))S.done.push(i);save();snd.win();burst();say('Tahniah! Misi selesai!',500);
  show(`<h1>MISI ${i+1} SELESAI!</h1><svg viewBox="0 0 120 120" class="badge"><use href="#lencana"/></svg><p class="t">Anda dapat satu lencana!</p><button class="big" id="go">TERUSKAN ▶</button>`);
  $('#go').onclick=()=>S.done.length==5?end():map()}
function end(){music('end');
  snd.win();say('Tahniah, Ejen! Hebat!',500);
  show(`<div class="cert"><div class="row" style="align-items:center">${agent('cel')}<div><h1>TAHNIAH, EJEN!</h1><p class="t">ANDA TELAH BERJAYA MENYELESAIKAN MISI MENGENALI PENGANGKUTAN DARAT.</p><p class="t" style="color:var(--gold);margin-top:1vmin">★ ${stars()} / ${total()} bintang</p></div></div><div class="row" style="margin-top:2vmin">${LAND.map(k=>sv(k,'bob')).join('')}</div></div><div class="row"><button class="big" id="rp">ULANGI MISI ↻</button><button class="big" id="hm" style="background:linear-gradient(#1a3ea8,#0b1a52);animation:none">KEMBALI KE HALAMAN UTAMA</button></div>`);
  $('#rp').onclick=()=>{S.got={};S.done=[];save();map()};$('#hm').onclick=home}
home();
</script>
</body>
